<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dataset Manager</title>

    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }

        .card {
            border: 1px solid #ddd;
            padding: 10px;
            margin: 10px;
            display: inline-block;
            width: 220px;
            vertical-align: top;
        }

        img {
            width: 200px;
            height: auto;
        }

        button {
            margin-top: 5px;
            padding: 5px;
            cursor: pointer;
        }

        input {
            margin: 5px;
            padding: 5px;
        }

        .section {
            margin-bottom: 30px;
        }
    </style>
</head>

<body>

<h1>📦 Roboflow Dataset Manager</h1>

<!-- ================= PROJECT ================= -->
<div class="section">
    <h3>Project</h3>

    <input type="text" id="projectId" placeholder="Enter Project ID">

    <button onclick="loadImages()">Load Images</button>
</div>

<hr>

<!-- ================= UPLOAD ================= -->
<div class="section">
    <h3>Upload Image</h3>

    <input type="file" id="fileInput">

    <button onclick="uploadImage()">Upload</button>
</div>

<hr>

<!-- ================= VERSIONS ================= -->
<div class="section">
    <h3>Dataset Versions</h3>

    <button onclick="loadVersions()">Load Versions</button>

    <div id="versions"></div>
</div>

<hr>

<!-- ================= IMAGES ================= -->
<div class="section">
    <h3>Images</h3>

    <div id="imageList"></div>
</div>

<script>

    // ================= UPLOAD IMAGE =================
    async function uploadImage() {

        const projectId = document.getElementById("projectId").value;
        const file = document.getElementById("fileInput").files[0];

        if (!file || !projectId) {
            alert("Missing data");
            return;
        }

        const formData = new FormData();
        formData.append("file", file);

        const res = await fetch(`/projects/${projectId}/images`, {
            method: "POST",
            body: formData
        });

        const data = await res.json();
        console.log(data);

        alert("Uploaded!");
        loadImages();
    }

    // ================= LOAD IMAGES =================
    async function loadImages() {

        const projectId = document.getElementById("projectId").value;

        if (!projectId) {
            alert("Enter project ID");
            return;
        }

        const res = await fetch(`/projects/${projectId}/images`);
        const data = await res.json();

        const container = document.getElementById("imageList");
        container.innerHTML = "";

        // Roboflow response parsing (flexible)
        const images = data.images || data || [];

        images.forEach(img => {

            const url = img.url || img.image || img;

            const annotated = img.annotated ? "YES" : "NO";

            const annotatorUrl = img.annotation_url || "#";

            const div = document.createElement("div");
            div.className = "card";

            div.innerHTML = `
                <img src="${url}" />
                <p>Annotated: ${annotated}</p>

                <a href="${annotatorUrl}" target="_blank">
                    Open Annotator
                </a>
            `;

            container.appendChild(div);
        });
    }

    // ================= LOAD VERSIONS =================
    async function loadVersions() {

        const projectId = document.getElementById("projectId").value;

        const res = await fetch(`/projects/${projectId}/versions`);
        const data = await res.json();

        const container = document.getElementById("versions");
        container.innerHTML = "";

        (data.versions || data || []).forEach(v => {

            const div = document.createElement("div");
            div.innerHTML = `
                <p>Version: ${v.version || v.id}</p>
                <p>Date: ${v.created || "N/A"}</p>
            `;

            container.appendChild(div);
        });
    }

</script>

</body>
</html>
